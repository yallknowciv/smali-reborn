<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smali reborn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #39ff14;
            text-shadow: 
                0 0 5px #39ff14,
                0 0 10px #39ff14,
                0 0 20px #39ff14,
                0 0 40px #39ff14,
                0 0 80px #39ff14;
            animation: tremble 0.2s infinite alternate, flicker 1.5s infinite;
        }

        h1 {
            font-size: 96px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -2px;
            color: #39ff14;
            text-shadow: 
                0 0 5px #39ff14,
                0 0 10px #39ff14,
                0 0 20px #39ff14,
                0 0 40px #39ff14,
                0 0 80px #39ff14;
            animation: tremble 0.2s infinite alternate, flicker 1.5s infinite;
        }

        .subtitle {
            font-size: 24px;
            color: #39ff14;
            text-shadow: 0 0 3px #39ff14, 0 0 6px #39ff14;
            margin-bottom: 64px;
        }

        .downloadgrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 800px;
            width: 100%;
        }

        .downloadcard {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 48px 32px;
            text-decoration: none;
            color: #39ff14;
            text-shadow: 0 0 2px #39ff14, 0 0 5px #39ff14;
            display: block;
            transition: all 0.1s ease; /* faster hover response */
            position: relative;
        }

        .downloadcard:hover {
            transform: translateY(-4px);
            border-color: rgba(57, 255, 20, 0.5);
            background: rgba(57, 255, 20, 0.05);
        }

        .downloadcard h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .downloadcard p {
            color: rgba(57, 255, 20, 0.7);
            font-size: 15px;
        }

        footer {
            text-align: center;
            padding: 48px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 120px;
            color: rgba(57, 255, 20, 0.5);
            font-size: 14px;
        }

        .navlinks {
            display: flex;
            gap: 32px;
        }

        .navlinks a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        .navlinks a:hover {
            color: #39ff14;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 120px 24px 80px;
        }

        @keyframes tremble {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, 1px); }
            100% { transform: translate(-1px, -1px); }
        }

        @keyframes flicker {
            0% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 1; }
            10% { text-shadow: 0 0 4px #39ff14,0 0 8px #39ff14,0 0 16px #39ff14,0 0 32px #39ff14,0 0 64px #39ff14; opacity: 0.9; }
            20% { text-shadow: 0 0 6px #39ff14,0 0 12px #39ff14,0 0 24px #39ff14,0 0 48px #39ff14,0 0 96px #39ff14; opacity: 1; }
            30% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 0.95; }
            40% { text-shadow: 0 0 7px #39ff14,0 0 14px #39ff14,0 0 28px #39ff14,0 0 56px #39ff14,0 0 112px #39ff14; opacity: 1; }
            50% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 0.9; }
            60% { text-shadow: 0 0 6px #39ff14,0 0 12px #39ff14,0 0 24px #39ff14,0 0 48px #39ff14,0 0 96px #39ff14; opacity: 1; }
            70% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 0.95; }
            80% { text-shadow: 0 0 7px #39ff14,0 0 14px #39ff14,0 0 28px #39ff14,0 0 56px #39ff14,0 0 112px #39ff14; opacity: 1; }
            90% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 0.92; }
            100% { text-shadow: 0 0 5px #39ff14,0 0 10px #39ff14,0 0 20px #39ff14,0 0 40px #39ff14,0 0 80px #39ff14; opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 56px;
            }
            .downloadgrid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>

    <section class="hero" id="home">
        <h1>smali reborn</h1>

        </div>

    <footer>

</body>
</html>
