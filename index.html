<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>smali reborn</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #000;
        color: #fff;
        overflow-x: hidden;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 48px;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
        background: rgba(0, 0, 0, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
        font-size: 20px;
        font-weight: 600;
        color: #39ff14;
    }

    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 120px 24px 80px;
        gap: 32px;
    }

    .subtitle {
        font-size: 20px;
        color: #39ff14;
    }

    .button-group {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
    }

    .button {
        padding: 16px 32px;
        background: rgba(57, 255, 20, 0.1);
        border: 1px solid #39ff14;
        border-radius: 12px;
        color: #39ff14;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
        transition: 0.2s;
        min-width: 150px;
    }

    .button:hover {
        background: rgba(57, 255, 20, 0.2);
        transform: translateY(-2px);
    }

    footer {
        text-align: center;
        padding: 48px 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(57, 255, 20, 0.5);
        font-size: 14px;
        margin-top: 120px;
    }

    @media (max-width: 480px) {
        .button-group {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
    <nav>
        <div class="logo">smali reborn</div>
        <div class="navlinks">
            <a href="https://gofile.io" style="color:#fff;text-decoration:none;">gofile</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1 style="color:#39ff14;">smali reborn</h1>
        <p class="subtitle">https://discord.gg/Ef3aaaEQVj</p>

        <div class="button-group">
            <a href="https://gofile.io/d/aU0vMb" class="button">Mods</a>
            <a href="https://discord.gg/Ef3aaaEQVj" class="button">Discord</a>
        </div>
    </section>

    <footer>
        <p>smali reborn © 2025</p>
    </footer>
</body>
</html>
